name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-x86-64-posix zip
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix

      - name: Build
        run: sh build-mingw.sh

      - name: Package
        run: |
          mkdir -p dist/TaskbarPopup
          cp TaskbarPopup.exe README.md LICENSE dist/TaskbarPopup/
          cd dist && zip -r TaskbarPopup.zip TaskbarPopup

      - uses: actions/upload-artifact@v4
        with:
          name: TaskbarPopup
          path: dist/TaskbarPopup/

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/TaskbarPopup.zip --title "$GITHUB_REF_NAME" --generate-notes
